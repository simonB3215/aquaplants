# Nginx: único punto de entrada (ES2 §3.4). HTTP en 8080 para desarrollo/red local.
# En producción: terminar TLS 1.3 (Let's Encrypt) según docs/DESPLIEGUE.md.
limit_req_zone $binary_remote_addr zone=ingesta_ip:10m rate=600r/m;   # global por IP (el límite por dispositivo lo aplica la API tras autenticar)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 64k;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

  location /api/v1/telemetria {
    limit_req zone=ingesta_ip burst=50 nodelay;
    proxy_pass http://api:3000;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /api/v1/auth/ {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://api:3000;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
    proxy_buffering off;   # exportación CSV en streaming
  }
  location = /sw.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
  }
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
