name: CI
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: aquaplants_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aquaplants_test
      TEST_MONGO_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w packages/frontend
      # Falla si aparece una vulnerabilidad alta o crítica en dependencias de producción.
      - run: npm audit --omit=dev --audit-level=high
