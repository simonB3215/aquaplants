# AquaPlants / AquaBrain — entorno reproducible (desarrollo, demostración y base de producción).
#   cp .env.example .env   # y cambie TODOS los secretos
#   docker compose up -d --build                    # BD + API + worker + web (http://localhost:8080)
#   docker compose --profile demo up -d --build     # + simulador AquaBrain
#   docker compose --profile backup run --rm backup # respaldo cifrado (cron del host, 02:00)
#   docker compose --profile restauracion run --rm restaurar  # prueba de restauración CP-29
# Redes: «edge» (web↔api) y «data» (interna, sin salida; BD sin puertos publicados).
name: aquaplants

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-development}
  # Mínimo privilegio (ES2 §3.4): API y worker usan app_rw, nunca el superusuario.
  DATABASE_URL: postgres://app_rw:${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD en .env}@postgres:5432/${POSTGRES_DB}
  MONGO_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/aquaplants?authSource=aquaplants
  MONGO_DB: aquaplants
  JWT_SECRET: ${JWT_SECRET}
  TRUST_PROXY: "true"
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
  DEVICE_RATE_LIMIT_PER_MIN: ${DEVICE_RATE_LIMIT_PER_MIN:-30}
  SIN_SENAL_FACTOR: ${SIN_SENAL_FACTOR:-3}
  WORKER_SIN_SENAL_CADA_S: ${WORKER_SIN_SENAL_CADA_S:-60}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  NOTIFICACIONES_SOLO_A: ${NOTIFICACIONES_SOLO_A:-}
  APP_URL: ${APP_URL:-http://localhost:8080}
  RESTABLECER_MINUTOS: ${RESTABLECER_MINUTOS:-30}
  DEMO_MODE: ${DEMO_MODE:-false}
  SIM_CONTROL_URL: http://simulador:4100
  SIM_CONTROL_TOKEN: ${SIM_CONTROL_TOKEN:-}
  DEMO_ENCARGADO_EMAIL: ${DEMO_ENCARGADO_EMAIL:-}
  DEMO_ENCARGADO_PASSWORD: ${DEMO_ENCARGADO_PASSWORD:-}

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      # -h 127.0.0.1: durante la inicialización el servidor temporal solo escucha por socket;
      # así el contenedor no se declara sano hasta que acepta conexiones TCP reales.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
      - ./infrastructure/mongo/init-usuario.js:/docker-entrypoint-initdb.d/init-usuario.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_BACKUP_USER: ${MONGO_BACKUP_USER:-respaldo}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:-}
    networks: [data]
    healthcheck:
      # --host $(hostname): el mongod temporal de inicialización solo escucha en 127.0.0.1.
      test: ["CMD-SHELL", "mongosh --quiet --host \"$$(hostname)\" --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # Asegura los usuarios de MongoDB también en volúmenes ya inicializados (idempotente).
  mongo-usuarios:
    image: mongo:7.0
    command: ["sh", "-c", "mongosh --quiet \"mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@mongo:27017/admin\" /init-usuario.js"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_BACKUP_USER: ${MONGO_BACKUP_USER:-respaldo}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:-}
    volumes:
      - ./infrastructure/mongo/init-usuario.js:/init-usuario.js:ro
    depends_on:
      mongo: { condition: service_healthy }
    networks: [data]
    restart: "no"

  migrate:
    build: { context: ., target: api }
    command: ["sh", "-c", "npx tsx packages/backend/src/scripts/migrate.ts && if [ \"$$SEMBRAR\" = \"true\" ]; then npx tsx packages/backend/src/scripts/seed.ts && chown -R 1000:1000 /simconfig; fi"]
    environment:
      <<: *api-env
      # Solo las migraciones usan el superusuario: crean el esquema y asignan LOGIN a los roles.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_RO_PASSWORD: ${DB_RO_PASSWORD:-}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:-}
      SEMBRAR: ${SEMBRAR_DATOS_PRUEBA:-false}
      SEED_INTERVALO_S: ${SEED_INTERVALO_S:-60}
      SIM_CONFIG_PATH: /simconfig/dispositivos.json
      SEED_PASSWORD_ADMIN: ${SEED_PASSWORD_ADMIN:-}
      SEED_PASSWORD_SUPERVISOR: ${SEED_PASSWORD_SUPERVISOR:-}
      SEED_PASSWORD_ENCARGADO: ${SEED_PASSWORD_ENCARGADO:-}
    user: root
    volumes: [simconfig:/simconfig]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    restart: "no"

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      mongo-usuarios: { condition: service_completed_successfully }
    networks: [edge, data]

  worker:
    build: { context: ., target: api }
    command: ["node", "packages/backend/dist/worker.js"]
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      mongo-usuarios: { condition: service_completed_successfully }
    networks: [data, salida]
    healthcheck: { disable: true }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]

  simulador:
    profiles: [demo]
    build: { context: ., target: simulador }
    restart: unless-stopped
    environment:
      API_URL: http://web:8080/api/v1
      SIM_CONFIG_PATH: /simconfig/dispositivos.json
      SIM_DATA_DIR: /datos
      SIM_CONTROL_HOST: 0.0.0.0
      SIM_CONTROL_TOKEN: ${SIM_CONTROL_TOKEN}
      SIM_COLA_BYTES: ${SIM_COLA_BYTES:-524288}
      SIM_BACKOFF_BASE_MS: ${SIM_BACKOFF_BASE_MS:-5000}
    volumes:
      - simconfig:/simconfig:ro
      - simdatos:/datos    # cola persistente: sobrevive a reinicios del contenedor (corte eléctrico simulado)
    depends_on:
      web: { condition: service_started }
    networks: [edge]

  backup:
    profiles: [backup]
    build: ./infrastructure/backup
    image: aquaplants-respaldo
    entrypoint: ["/bin/sh", "/scripts/respaldar.sh"]
    environment:
      PGHOST: postgres
      PGUSER: backup_ro
      PGPASSWORD: ${DB_BACKUP_PASSWORD:-}
      PGDATABASE: ${POSTGRES_DB}
      MONGO_BACKUP_URI: mongodb://${MONGO_BACKUP_USER:-respaldo}:${MONGO_BACKUP_PASSWORD:-}@mongo:27017/aquaplants?authSource=aquaplants
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}   # clave PÚBLICA: el servidor puede cifrar pero no descifrar
    volumes:
      - ./infrastructure/backup:/scripts:ro
      - ./respaldos:/respaldos
    networks: [data]

  # ---- Prueba de restauración CP-29: contenedores limpios, efímeros (tmpfs) y aislados.
  pg-prueba:
    profiles: [restauracion]
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust   # red interna «restauracion» sin otros servicios; datos en tmpfs
    tmpfs: [/var/lib/postgresql/data]
    networks: [restauracion]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      retries: 30

  mongo-prueba:
    profiles: [restauracion]
    image: mongo:7.0
    tmpfs: [/data/db]
    networks: [restauracion]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 3s
      retries: 30

  restaurar:
    profiles: [restauracion]
    image: aquaplants-respaldo
    build: ./infrastructure/backup
    entrypoint: ["/bin/sh", "/scripts/restaurar.sh"]
    environment:
      AGE_IDENTITY: /claves/age-respaldo.key
      ROL_PROPIETARIO: ${POSTGRES_USER}
    volumes:
      - ./infrastructure/backup:/scripts:ro
      - ./respaldos:/respaldos
      # Clave PRIVADA age: en producción vive fuera del servidor y solo se monta para restaurar.
      - ${AGE_IDENTITY_DIR:-./secretos}:/claves:ro
    depends_on:
      pg-prueba: { condition: service_healthy }
      mongo-prueba: { condition: service_healthy }
    networks: [restauracion]

volumes:
  pgdata:
  mongodata:
  simconfig:
  simdatos:

networks:
  edge:
  data:
    internal: true
  salida:   # solo el worker sale a Internet (SMTP)
  restauracion:
    internal: true
