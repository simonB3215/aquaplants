# Netlify (D-30): la web (PWA). Las llamadas a /api se reenvían a la API en Render,
# así el navegador ve un solo origen (sin CORS, CSP connect-src 'self', cookies/PWA simples).
[build]
  command = "npm ci && npm run build:shared && npm run build -w packages/frontend"
  publish = "packages/frontend/dist"

[build.environment]
  NODE_VERSION = "22"

# Si el servicio de Render tiene otra URL, cámbiela aquí.
[[redirects]]
  from = "/api/*"
  to = "https://aquaplants-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA: cualquier otra ruta la resuelve React.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'"

# index.html y el service worker siempre se revalidan (versiones nuevas de la PWA).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
