# Render Blueprint (D-30): API (+ worker) y simulador. La web va en Vercel (D-36) y la base en Supabase + Neon.
# Render → New → Blueprint → elegir este repositorio. Los valores con «sync: false» se piden al crear.
# Si Render no puede usar los nombres de abajo, la URL cambia: ajústela en vercel.json (rewrite de /api) y en las variables.
services:
  - type: web
    name: aquaplants-api
    runtime: node
    plan: free
    region: virginia   # Supabase está en us-east-1 (Virginia) y Neon en us-east-2 (Ohio)
    buildCommand: npm ci && npm run build:shared && npm run build -w packages/backend
    # Solo redesplegar (y reiniciar) cuando cambia código que usa este servicio:
    # un commit de documentación o de la web no debe reiniciar la demostración.
    buildFilter:
      ignoredPaths:
        - "docs/**"
        - "**/*.md"
        - "packages/frontend/**"
        - "pruebas/**"
        - "tests/**"
        - "vercel.json"
        - ".github/**"
    startCommand: node packages/backend/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # DEMO_MODE no puede usarse con NODE_ENV=production (demo aislada de producción).
      - key: NODE_ENV
        value: development
      - key: DEMO_MODE
        value: "true"
      - key: WORKER_EN_API
        value: "true"
      # Vercel → balanceador de Render: 2 proxies delante de la API.
      # D-35: Supabase no tiene TimescaleDB; se conservan 30 días de mediciones crudas
      # (la evidencia de las alertas se guarda aparte y no se borra).
      - key: RETENCION_MEDICIONES_DIAS
        value: "30"
      - key: TRUST_PROXY
        value: "2"
      # Supabase (Session pooler) terminada en ?sslmode=verify-full&sslrootcert=certificados/supabase-ca.crt
      - key: DATABASE_URL
        sync: false
      # Neon (payloads crudos).
      - key: PAYLOADS_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # URL de la web en Vercel: https://aquaplants.vercel.app
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: SIM_CONTROL_URL
        value: https://aquaplants-simulador.onrender.com
      - key: SIM_CONTROL_TOKEN
        fromService:
          type: web
          name: aquaplants-simulador
          envVarKey: SIM_CONTROL_TOKEN
      - key: DEMO_ENCARGADO_EMAIL
        value: encargado@aquaplants.cl
      - key: DEMO_ENCARGADO_PASSWORD
        sync: false
      - key: DEVICE_RATE_LIMIT_PER_MIN
        value: "30"
      - key: WORKER_SIN_SENAL_CADA_S
        value: "10"
      - key: SIN_SENAL_FACTOR
        value: "3"
      - key: RESTABLECER_MINUTOS
        value: "30"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: NOTIFICACIONES_SOLO_A
        sync: false
      # Render free bloquea los puertos SMTP: los correos salen por la API HTTP de Resend.
      - key: RESEND_API_KEY
        sync: false

  - type: web
    name: aquaplants-simulador
    runtime: node
    plan: free
    region: virginia   # Supabase está en us-east-1 (Virginia) y Neon en us-east-2 (Ohio)
    buildCommand: npm ci && npm run build:shared
    # Solo redesplegar (y reiniciar) cuando cambia código que usa este servicio:
    # un commit de documentación o de la web no debe reiniciar la demostración.
    buildFilter:
      ignoredPaths:
        - "docs/**"
        - "**/*.md"
        - "packages/frontend/**"
        - "pruebas/**"
        - "tests/**"
        - "vercel.json"
        - ".github/**"
    startCommand: npm run start -w packages/simulador
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Directo a la API de Render: https://aquaplants-api.onrender.com/api/v1
      - key: API_URL
        sync: false
      # Credenciales de los dispositivos (packages/simulador/data/dispositivos.json del seed) como Secret File.
      - key: SIM_CONFIG_PATH
        value: /etc/secrets/dispositivos.json
      # La API de control escucha en el puerto de Render; sin token se niega a abrirse fuera de localhost.
      - key: SIM_CONTROL_HOST
        value: 0.0.0.0
      - key: SIM_CONTROL_PORT
        value: "10000"
      - key: SIM_CONTROL_TOKEN
        generateValue: true
      - key: SIM_BACKOFF_BASE_MS
        value: "3000"
